<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Roupas</title>
    <!-- Ícones modernos (Lucide Icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">

    <div style="background-color: #7f1d1d; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(234, 179, 8, 0.2); width: 100%; max-width: 420px; box-sizing: border-box; text-align: center; border: 2px solid #eab308;">
        
        <!-- Reservatório de Imagem (Placeholder) - Reator Arc Style -->
        <div style="width: 100%; height: 180px; background-color: #450a0a; border: 2px dashed #eab308; border-radius: 0.75rem; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #38bdf8; margin-bottom: 1.5rem; box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2);">
            <i data-lucide="zap" style="width: 32px; height: 32px; margin-bottom: 0.5rem; stroke-width: 1.5; color: #38bdf8;"></i>
            <span style="font-size: 0.875rem; font-weight: 600; color: #fef08a;">Espaço reservado para Imagem/Banner</span>
        </div>

        <h3 style="margin: 0 0 0.5rem 0; font-size: 1.5rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">
            <i data-lucide="shield" style="width: 24px; height: 24px; color: #eab308;"></i>
            Página De Roupas
        </h3>

        <p style="margin: 0 0 1.75rem 0; color: #fef08a; font-size: 0.95rem; font-weight: 500;">
            Bem vindo(a) à nossa loja!
        </p>

        <!-- Navegação / Rotas mantidas -->
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <a href="/Pagina inicial" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background-color: #eab308; color: #450a0a; text-decoration: none; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 700; font-size: 0.9rem; transition: background-color 0.2s; border: 1px solid #fef08a;">
                <i data-lucide="home" style="width: 18px; height: 18px;"></i>
                Navegar Página Inicial
            </a>

            <a href="/erro" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background-color: #450a0a; color: #f87171; text-decoration: none; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.9rem; border: 1px solid #991b1b;">
                <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                Página Erro
            </a>
        </div>
    </div>

    <!-- Script para renderizar os ícones -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
