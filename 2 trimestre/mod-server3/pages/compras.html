<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Roupas</title>
    <!-- Ícones modernos (Lucide Icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">

    <div style="background-color: #ffffff; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); width: 100%; max-width: 420px; box-sizing: border-box; text-align: center; border: 1px solid #e2e8f0;">
        
        <!-- Reservatório de Imagem (Placeholder) -->
        <div style="width: 100%; height: 180px; background-color: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 0.75rem; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; margin-bottom: 1.5rem;">
            <i data-lucide="image" style="width: 32px; height: 32px; margin-bottom: 0.5rem; stroke-width: 1.5;"></i>
            <span style="font-size: 0.875rem; font-weight: 500;">Espaço reservado para Imagem/Banner</span>
        </div>

        <h3 style="margin: 0 0 0.5rem 0; font-size: 1.5rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <i data-lucide="shopping-bag" style="width: 24px; height: 24px; color: #4f46e5;"></i>
            Página De Roupas
        </h3>

        <p style="margin: 0 0 1.75rem 0; color: #64748b; font-size: 0.95rem;">
            Bem vindo(a) à nossa loja!
        </p>

        <!-- Navegação / Rotas mantidas -->
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <a href="/Pagina inicial" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background-color: #4f46e5; color: #ffffff; text-decoration: none; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.9rem; transition: background-color 0.2s;">
                <i data-lucide="home" style="width: 18px; height: 18px;"></i>
                Navegar Página Inicial
            </a>

            <a href="/erro" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background-color: #f1f5f9; color: #ef4444; text-decoration: none; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.9rem; border: 1px solid #fee2e2;">
                <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                Página Erro
            </a>
        </div>
    </div>

    <!-- Script para renderizar os ícones -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
