<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - 404</title>
</head>
<body style="font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; color: #222; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box;">

    <main style="max-width: 600px; width: 100%; background-color: #ffffff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); text-align: center; border: 1px solid #f1f5f9;">
        
        <div style="font-size: 72px; margin-bottom: 10px;">⚠️</div>
        
        <h1 style="margin: 0; font-size: 64px; font-weight: 800; color: #4f46e5; letter-spacing: -1px; line-height: 1;">404</h1>
        
        <h2 style="margin: 16px 0 8px 0; font-size: 24px; color: #1e1b4b; font-weight: 700;">Ops! Página não encontrada</h2>
        
        <p style="margin: 0 0 32px 0; color: #64748b; font-size: 15px; line-height: 1.6;">
            A página que você está procurando pode ter sido removida, alterada ou está temporariamente indisponível.
        </p>
        
        <a href="/" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #ffffff; background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 14px 28px; border-radius: 10px; font-weight: 600; font-size: 15px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);">
            <span>🏠</span> Voltar para a Tela Inicial
        </a>

    </main>

</body>
</html>
